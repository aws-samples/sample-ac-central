image: public.ecr.aws/docker/library/node:24-alpine

stages:
  - deploy

pages:
  stage: deploy
  script:
    - cd docs
    - npm ci
    - npm run build
    - mv build ../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: https://$CI_PROJECT_ROOT_NAMESPACE.pages.aws.dev/$CI_PROJECT_NAME
